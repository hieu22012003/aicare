# Render Blueprint (Root Directory = repository root).
# Free plan: no persistent disk, so the SQLite database lives in /tmp and is recreated on every deploy
# or wake-up. AICARE_BOOTSTRAP_CAREGIVER recreates the caregiver login automatically.
# For permanent data: plan: starter, add a disk at /var/data and point AI_CARE_DB_PATH there.
services:
  - type: web
    name: aicare
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements-backend.txt
    startCommand: python -m apps.server.main
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: AI_CARE_DB_PATH
        value: /tmp/aicare/unified_care.sqlite3
      - key: AI_CARE_HOME
        value: /tmp/aicare/runtime
      - key: AICARE_ADMIN_PASSWORD
        sync: false
      - key: AICARE_BOOTSTRAP_CAREGIVER
        sync: false
      - key: AICARE_DEVICE_KEYS
        sync: false
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
