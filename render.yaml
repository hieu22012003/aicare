# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository.
# A persistent disk keeps the SQLite database across deploys and restarts (needs a paid instance).
services:
  - type: web
    name: aicare-core-backend
    runtime: python
    plan: starter
    region: singapore
    branch: main
    buildCommand: pip install -r requirements-backend.txt
    startCommand: python -m backend.main
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: aicare-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: AI_CARE_DB_PATH
        value: /var/data/unified_care.sqlite3
      - key: AI_CARE_HOME
        value: /var/data/runtime
      - key: AICARE_ADMIN_PASSWORD
        sync: false
      - key: AICARE_DEVICE_KEYS
        sync: false
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
